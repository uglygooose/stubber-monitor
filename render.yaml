services:
  - type: web
    name: stubber-monitor
    runtime: python
    plan: free
    region: frankfurt   # closest to South Africa
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 60
    envVars:
      - key: DATABASE_URL
        sync: false   # paste the Supabase Session pooler string in Render UI
      - key: INGEST_TOKEN
        sync: false   # paste the 40-char random string in Render UI
      - key: PYTHON_VERSION
        value: 3.12.7
